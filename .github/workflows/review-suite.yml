name: Review suite

on:
  push:
    branches: ['review/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-suite-${{ github.ref }}
  cancel-in-progress: false # Let earlier runs finish without cancellation emails.

# Every job ends green and prints a "REVIEW-SUITE PART:" line; the gate
# (ci_suite.py) needs the checks part and every test shard to decide.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Keep real outcomes, but do not turn a broken check into a failure email.
      - id: install
        continue-on-error: true
        run: npm ci --no-audit --no-fund
      - id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: lint
        continue-on-error: true
        run: npm run lint
      - id: build
        continue-on-error: true
        run: npm run build
      - name: Report actual check results
        if: always()
        env:
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 .github/scripts/review_suite_report.py checks
          npm-ci=${{ steps.install.outcome }}
          typecheck=${{ steps.typecheck.outcome }}
          lint=${{ steps.lint.outcome }}
          build=${{ steps.build.outcome }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Shards are bin-packed by file weight (vitest.config.ts).
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: install
        timeout-minutes: 5
        continue-on-error: true
        run: npm ci --no-audit --no-fund
      - id: test
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 8m npm test -- \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --testTimeout=20000 --hookTimeout=20000 \
            --reporter=default --reporter=./.github/scripts/review_suite_reporter.mjs \
            --reporter=hanging-process --reporter=json --outputFile.json=test-results.json \
            2>&1 | tee test.log
      - name: Preserve shard diagnostics
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: review-suite-shard-${{ matrix.shard }}
          path: |
            test.log
            test-results.json
          retention-days: 7
      - name: Report actual check results
        if: always()
        env:
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 .github/scripts/review_suite_report.py
          test-${{ matrix.shard }}/${{ strategy.job-total }}
          npm-ci=${{ steps.install.outcome }}
          test=${{ steps.test.outcome }}
