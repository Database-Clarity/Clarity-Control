        var theme = 'system';
        try {
          var stored = JSON.parse(localStorage.getItem('clarity-settings:device:v1') || '{}');
          if (stored && (stored.theme === 'light' || stored.theme === 'dark')) theme = stored.theme;

          /* Storage is optional; fall back to the system theme. */

        if (theme === 'system') {

          } catch (error) {

          }
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#c3d3df' : '#1d2024');
      })();
    </script>
