    <script>
      // Sets the theme before first paint so a reload never flashes the wrong one. Mirrors
      // src/ui/theme.ts (resolveTheme/applyTheme) and the device key in src/stores/settings.ts.
      (function () {
        var theme = 'system';
        try {
          var stored = JSON.parse(localStorage.getItem('clarity-settings:device:v1') || '{}');
          if (stored && (stored.theme === 'light' || stored.theme === 'dark')) theme = stored.theme;
        } catch (error) {
          /* Storage is optional; fall back to the system theme. */
        }
        if (theme === 'system') {
          try {
            theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (error) {
            theme = 'dark';
          }
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#c3d3df' : '#1d2024');
      })();
    </script>
