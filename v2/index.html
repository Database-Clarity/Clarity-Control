<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1d2024" />
    <meta name="color-scheme" content="light dark" />
    <!-- The tab icon follows the browser's own theme, so it uses the media query, not the in-app setting. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="./favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./favicon-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <title>Clarity Control</title>
    <script>
      // Sets the theme before first paint so a reload never flashes the wrong one. Mirrors
      // src/ui/theme.ts (resolveTheme/applyTheme) and the device key in src/stores/settings.ts.
      (function () {
        var theme = 'system';
        try {
          var stored = JSON.parse(localStorage.getItem('clarity-settings:device:v1') || '{}');
          if (stored && (stored.theme === 'light' || stored.theme === 'dark')) theme = stored.theme;
        } catch (error) {
          /* Storage is optional; fall back to the system theme. */
        }
        if (theme === 'system') {
          try {
            theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (error) {
            theme = 'dark';
          }
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#d8e7f2' : '#1d2024');
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CIup3Eid.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dogto0zT.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
